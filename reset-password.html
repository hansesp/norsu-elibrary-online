<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORSU E-Library — Reset Password</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="authwrap">
  <button id="themeToggleBtn" class="iconBtn" style="position:fixed;top:16px;right:16px;" aria-label="Toggle dark mode">🌙</button>
  <div class="authcard">
    <img src="logo.png" alt="NORSU seal" style="width:64px;height:64px;display:block;margin:0 auto 14px;">
    <h1 style="text-align:center">Reset your password</h1>
    <p class="sub" style="text-align:center" id="formSub">NORSU Guihulngan Campus E-Library</p>
    <div id="errorBox"></div>

    <form id="resetForm" style="display:none">
      <div class="field"><label>New password</label><input type="password" id="newPassword" required minlength="6"></div>
      <div class="field"><label>Confirm new password</label><input type="password" id="confirmPassword" required minlength="6"></div>
      <button class="btn" type="submit" style="width:100%">Set New Password</button>
    </form>

    <div id="invalidBox" style="display:none;text-align:center;">
      <p class="sub">This reset link is invalid or has expired. Reset links are only valid for 1 hour and can only be used once.</p>
      <p><a href="index.html">Back to sign in</a></p>
    </div>

    <div id="successBox" style="display:none;text-align:center;">
      <p class="sub" style="color:var(--green);">Your password has been changed successfully.</p>
      <p><a href="index.html">Continue to sign in</a></p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
const errorBox = document.getElementById('errorBox');
function showError(msg){ errorBox.innerHTML = ''; const d = document.createElement('div'); d.className = 'error'; d.textContent = msg; errorBox.appendChild(d); }

function getEffectiveTheme(){
  const explicit = document.documentElement.getAttribute('data-theme');
  if(explicit) return explicit;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function updateThemeBtn(){ document.getElementById('themeToggleBtn').textContent = getEffectiveTheme()==='dark' ? '☀️' : '🌙'; }
document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
  const next = getEffectiveTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
  updateThemeBtn();
});
updateThemeBtn();

function showForm(){ document.getElementById('invalidBox').style.display='none'; document.getElementById('resetForm').style.display='block'; }
function showInvalid(){ document.getElementById('resetForm').style.display='none'; document.getElementById('invalidBox').style.display='block'; }

let recoveryReady = false;
if (!window.sbMissing) {
  // Supabase signals a valid reset link with this event
  sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') { recoveryReady = true; showForm(); } });
}

(async function init(){
  if (window.sbMissing) { showError(window.sbMissingReason); return; }
  const url = (window.INITIAL_HASH || '') + '&' + (window.INITIAL_SEARCH || '');
  // an expired / already-used link comes back with an error in the address
  if (/error=|error_code=|error_description=/.test(url)) { showInvalid(); return; }
  const looksLikeResetLink = /type=recovery/.test(url) || /[?&#]code=/.test(url) || /token_hash=/.test(url);
  if (!looksLikeResetLink) { showInvalid(); return; }
  // give the library a moment to read the link and start the recovery session
  for (let i = 0; i < 25 && !recoveryReady; i++) {
    await new Promise(r => setTimeout(r, 200));
    if (!recoveryReady) {
      const { data } = await sb.auth.getSession();
      if (data && data.session) { recoveryReady = true; showForm(); }
    }
  }
  if (!recoveryReady) showInvalid();
})();

document.getElementById('resetForm').addEventListener('submit', async e=>{
  e.preventDefault();
  errorBox.innerHTML = '';
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  if(newPassword !== confirmPassword){ showError('Passwords do not match.'); return; }
  if(newPassword.length < 6){ showError('Password must be at least 6 characters.'); return; }

  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.auth.updateUser({ password: newPassword });
  btn.disabled = false; btn.textContent = 'Set New Password';
  if (error) {
    const m = String(error.message || '').toLowerCase();
    showError(m.indexOf('different') !== -1 ? 'Your new password must be different from the old one.' : friendlyAuthError(error));
    return;
  }
  await sb.auth.signOut(); // make them sign in again with the new password
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('successBox').style.display = 'block';
});
</script>
<script src="pwtoggle.js"></script>
</body>
</html>
